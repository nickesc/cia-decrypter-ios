name: Release

"on":
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing version tag; leave blank to release the selected ref's app version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Check app version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          version="$(ruby -ryaml -e 'puts YAML.load_file("project.yml").fetch("settings").fetch("base").fetch("MARKETING_VERSION")')"
          bash Scripts/check-release.sh "$version"
          printf 'ref=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.version.outputs.ref }}

  release:
    name: Build and publish IPA
    needs: [version, test]
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      RELEASE_REF: ${{ needs.version.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build unsigned device IPA
        run: bash Scripts/build-ipa.sh
      - name: Validate tag and prepare AltStore source
        run: >-
          python3 Scripts/make-source.py build/CIADecrypter.ipa
          --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Keep release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CIADecrypter-${{ env.RELEASE_TAG }}
          path: |
            build/CIADecrypter.ipa
            build/distribution/source.json
            build/distribution/icon.png
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          build/CIADecrypter.ipa build/distribution/source.json build/distribution/icon.png
          --target "$RELEASE_REF" --title "CIA Decrypter for iOS $RELEASE_TAG" --generate-notes

  website:
    name: Publish AltStore source and website
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
