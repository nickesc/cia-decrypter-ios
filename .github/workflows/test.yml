name: Test

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests and simulator build
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test conversion and recovery
        run: swift test
      - name: Test release metadata
        run: python3 -m unittest discover -s Tests/Python
      - name: Check packaging script
        run: bash -n Scripts/build-ipa.sh
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -quiet -project CIADecrypter.xcodeproj -scheme CIADecrypter
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
